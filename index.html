<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>関西イベント時刻表</title>
<meta name="description" content="大阪・京都・神戸ほか関西の勉強会・講座・読書会・語学交流・ハイキング・音楽・アートなどを、時刻表のように一日ごとに一覧。毎日更新。">
<meta name="theme-color" content="#1b2a4a">
<meta property="og:title" content="関西イベント時刻表">
<meta property="og:description" content="関西の勉強会・講座・交流会・ハイキング・音楽などを毎日更新">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231b2a4a'/><text x='16' y='23' font-size='18' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>関</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*
 時刻表の掲示物がモチーフ。
 色：紺（印刷インク）／平日=紺・土曜=青・休日=赤（時刻表の慣習）／ジャンル=路線色
 書体：BIZ UDPGothic（公共サイン向けUD書体）＋数字は Barlow Semi Condensed
*/
:root{
 --paper:#ffffff;--ink:#1b2a4a;--ink-2:#55607a;--rule:#cfd5e0;--rule-2:#e8ecf2;--tint:#f2f5f9;
 --sat:#1f5fbf;--sun:#c8302c;
 --jp:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
 --num:"Barlow Semi Condensed","BIZ UDPGothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
 --paper:#121826;--ink:#e6eaf2;--ink-2:#9aa5bd;--rule:#2f3a52;--rule-2:#222b3e;--tint:#1a2233;
 --sat:#6f9ff0;--sun:#f07a74;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--jp);line-height:1.7;font-feature-settings:"palt" 1}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sat);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* 駅名標のような見出し板 */
.plate{background:#1b2a4a;color:#fff}
.plate .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:22px;padding-bottom:18px;flex-wrap:wrap}
.plate h1{margin:0;font-size:clamp(26px,5.4vw,40px);font-weight:700;letter-spacing:.08em;line-height:1.2}
.plate h1 small{display:block;font-size:13px;font-weight:400;letter-spacing:.04em;opacity:.8;margin-top:6px}
.plate .now{text-align:right;font-size:13px;opacity:.85;line-height:1.5}
.plate .now b{display:block;font-family:var(--num);font-size:22px;font-weight:600;opacity:1;letter-spacing:.02em}

/* 日付のつまみ */
.days{position:sticky;top:0;z-index:4;background:var(--paper);border-bottom:2px solid var(--ink)}
.days .wrap{display:flex;align-items:stretch;gap:8px}
.strip{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 auto;scroll-snap-align:start;min-width:52px;padding:8px 4px 6px;border:0;border-bottom:4px solid transparent;background:none;cursor:pointer;text-align:center;line-height:1.15}
.dbtn .m{display:block;font-size:10px;color:var(--ink-2);height:12px}
.dbtn .d{display:block;font-family:var(--num);font-size:24px;font-weight:600}
.dbtn .w{display:block;font-size:12px}
.dbtn .c{display:block;font-family:var(--num);font-size:12px;color:var(--ink-2);margin-top:2px}
.dbtn.sat .d,.dbtn.sat .w{color:var(--sat)}
.dbtn.sun .d,.dbtn.sun .w{color:var(--sun)}
.dbtn.zero{opacity:.4}
.dbtn[aria-pressed="true"]{border-bottom-color:var(--ink);background:var(--tint)}
.calbtn{flex:0 0 auto;align-self:center;border:1px solid var(--rule);background:var(--paper);padding:6px 10px;border-radius:4px;cursor:pointer;font-size:13px}
.calbtn[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* 月カレンダー（折りたたみ） */
.month{display:none;border-bottom:1px solid var(--rule);padding:12px 0 16px}
.month.open{display:block}
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mnav b{font-size:16px;margin-right:auto}
.mnav button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:2px 12px;cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.mgrid>*{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.mh{text-align:center;font-size:12px;padding:2px 0;background:var(--tint)}
.mh.sun{color:var(--sun)}.mh.sat{color:var(--sat)}
.mc{background:var(--paper);border-top:0;border-left:0;padding:4px 6px;min-height:46px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start}
.mc span{font-family:var(--num);font-weight:600;font-size:15px}
.mc small{font-family:var(--num);font-size:12px;color:var(--ink-2);align-self:flex-end}
.mc.sun span{color:var(--sun)}.mc.sat span{color:var(--sat)}
.mc.past{color:var(--ink-2);background:var(--tint)}
.mc.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.mc.blank{cursor:default;background:var(--tint)}

/* 絞り込み：路線図の凡例 */
.filters{padding:16px 0 4px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q{flex:1 1 240px;padding:9px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.frow select{padding:9px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.free{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.free input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.reset{border:0;background:none;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;color:var(--ink-2);padding:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:14px 0 0;padding:0;list-style:none}
.legend button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:4px 0;cursor:pointer;font-size:14px;color:var(--ink)}
.legend .sw{width:22px;height:8px;border-radius:4px;background:var(--c)}
.legend .n{font-family:var(--num);color:var(--ink-2);font-size:13px}
.legend.filtering button[aria-pressed="false"]{opacity:.38}
.legend button[aria-pressed="true"]{font-weight:700}

/* 時刻表本体 */
.dayhead{display:flex;align-items:baseline;gap:12px;margin:22px 0 0;padding:8px 12px;color:#fff;background:var(--band)}
.dayhead h2{margin:0;font-size:18px;letter-spacing:.04em}
.dayhead .kind{font-size:13px;padding:0 8px;border:1px solid #ffffff99;border-radius:3px}
.dayhead .cnt{margin-left:auto;font-family:var(--num);font-size:16px}
.tt{border:2px solid var(--band);border-top:0}
.hour{display:grid;grid-template-columns:64px 1fr;border-top:1px solid var(--rule)}
.hour:first-child{border-top:0}
.hh{font-family:var(--num);font-size:30px;font-weight:700;text-align:center;padding-top:6px;background:var(--tint);border-right:1px solid var(--rule);line-height:1.3}
.ev{display:grid;grid-template-columns:44px 1fr;gap:0 10px;padding:10px 14px 10px 10px;border-top:1px dashed var(--rule-2)}
.ev:first-child{border-top:0}
.mm{font-family:var(--num);font-size:22px;font-weight:600;line-height:1.25;text-align:right}
.ev h3{margin:0;font-size:16px;line-height:1.55;font-weight:700;word-break:break-word}
.ev h3 a{color:inherit;text-decoration:none;background:linear-gradient(var(--c),var(--c)) 0 100%/0 2px no-repeat}
.ev h3 a:hover{background-size:100% 2px}
.line{display:inline-block;vertical-align:2px;width:18px;height:7px;border-radius:4px;background:var(--c);margin-right:8px}
.sub{font-size:13px;color:var(--ink-2);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 16px}
.sub .fee-free{color:var(--ink);font-weight:700}
.sub .src{margin-left:auto}
.undated .hh{font-size:13px;font-family:var(--jp);font-weight:700;padding-top:12px}
.nothing{padding:28px 16px;text-align:center;color:var(--ink-2)}
.nothing button{margin-top:10px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.next{display:flex;justify-content:space-between;gap:8px;margin:14px 0 0}
.next button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:8px 14px;cursor:pointer;font-size:14px}
.next button:disabled{opacity:.35;cursor:default}

footer.wrap{margin:40px auto 0;border-top:1px solid var(--rule);padding:16px 0 40px;font-size:12px;color:var(--ink-2)}

@media (max-width:560px){
 .plate .now{text-align:left}
 .hour{grid-template-columns:44px 1fr}
 .hh{font-size:22px}
 .ev{grid-template-columns:34px 1fr;padding:9px 10px 9px 6px}
 .mm{font-size:18px}
 .ev h3{font-size:15px}
 .sub .src{margin-left:0}
 .plate .wrap{padding-top:16px;padding-bottom:14px}
 .plate h1 small .long{display:none}
 .plate .now{display:none}
 .frow select{flex:1}
 .legend{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:4px;gap:6px}
 .legend li{flex:0 0 auto}
 .legend button{border:1px solid var(--rule);border-radius:4px;padding:3px 9px}
 .filters{padding-top:12px}
}
@media (prefers-reduced-motion:no-preference){.ev h3 a{transition:background-size .2s}}
</style>
</head>
<body>
<header class="plate">
 <div class="wrap">
  <h1>関西イベント時刻表<small>大阪・京都・神戸ほか<span class="long">｜勉強会・講座・読書会・語学交流・ハイキング・音楽・アート</span></small></h1>
  <div class="now" id="now"></div>
 </div>
</header>

<nav class="days" aria-label="日付">
 <div class="wrap">
  <div class="strip" id="strip"></div>
  <button class="calbtn" id="calbtn" type="button" aria-expanded="false" aria-controls="month">月表示</button>
 </div>
</nav>

<main class="wrap">
 <section class="month" id="month" aria-label="月カレンダー">
  <div class="mnav"><b id="mlabel"></b><button id="mprev" type="button" aria-label="前の月">‹</button><button id="mnext" type="button" aria-label="次の月">›</button></div>
  <div class="mgrid" id="mgrid"></div>
 </section>

 <section class="filters" aria-label="絞り込み">
  <div class="frow">
   <input class="q" id="q" type="search" placeholder="キーワードや会場名で探す" aria-label="キーワードや会場名で探す">
   <select id="source" aria-label="情報源"><option value="">情報源：すべて</option></select>
   <label class="free"><input id="free" type="checkbox">無料のみ</label>
   <button class="reset" id="clear" type="button">条件をクリア</button>
  </div>
  <ul class="legend" id="legend" aria-label="ジャンル（複数選べます）"></ul>
 </section>

 <section id="board" aria-live="polite"></section>
 <div class="next"><button id="pday" type="button">前の日</button><button id="nday" type="button">次の日</button></div>
</main>

<footer class="wrap">参加前に、リンク先の公式ページで日時・場所・申込方法を確認してください。掲載情報は各サイトから自動で集めています。</footer>

<script>
const DOW=["日","月","火","水","木","金","土"];
const LINE={"IT勉強会":"#2f6fdb","講座・セミナー":"#0e8a8a","ワークショップ":"#e07a10","交流会":"#d6336c","語学交流":"#7b4fd6","読書会":"#8a6a1f","ハイキング":"#2f9e44","教育":"#1c9bc4","アート":"#c2389a","作業会":"#6b7686","音楽":"#d63a2f"};
const SPARE=["#3b5bdb","#5c940d","#b35c00","#0b7285","#a61e4d"];
const $=id=>document.getElementById(id);
const st={events:[],genres:[],sel:null,ym:null,genre:new Set(),meta:null};

const pad=n=>String(n).padStart(2,"0");
function lineColor(g){if(LINE[g])return LINE[g];let h=0;for(const c of String(g))h=(h*31+c.charCodeAt(0))>>>0;return SPARE[h%SPARE.length];}
function today(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return g("year")+"-"+g("month")+"-"+g("day");}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isFree=e=>/無料|free/i.test(e.fee||"");
const parts=ds=>ds.split("-").map(Number);
const dow=ds=>{const [y,m,d]=parts(ds);return new Date(y,m-1,d).getDay();};
function addDays(ds,n){const [y,m,d]=parts(ds);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());}
const kindOf=ds=>{const w=dow(ds);return w===0?"sun":w===6?"sat":"";};

function filtered(){
 const words=$("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean),s=$("source").value,f=$("free").checked;
 return st.events.filter(e=>{
  if(st.genre.size&&!st.genre.has(e.genre))return false;
  if(s&&e.source!==s)return false;
  if(f&&!isFree(e))return false;
  if(words.length){const hay=[e.title,e.venue,e.genre,e.source,e.fee].join(" ").toLowerCase();if(!words.every(w=>hay.includes(w)))return false;}
  return true;
 });
}
function countBy(list){const c={};list.forEach(e=>{c[e.date]=(c[e.date]||0)+1});return c;}

function renderNow(){
 const t=today(),[y,m,d]=parts(t);
 let upd="";
 if(st.meta&&st.meta.updatedAt)upd=new Date(st.meta.updatedAt).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})+" 更新";
 $("now").innerHTML=`<b>${m}月${d}日（${DOW[dow(t)]}）</b>${esc(upd)}`;
}

function renderStrip(cnt){
 const t=today();
 const dates=st.events.map(e=>e.date).filter(Boolean).sort();
 let start=t<st.sel?t:st.sel,end=dates.length?dates[dates.length-1]:t;
 if(end<st.sel)end=st.sel;
 let h="",ds=start,guard=0;
 while(ds<=end&&guard++<120){
  const [y,m,d]=parts(ds),n=cnt[ds]||0;
  h+=`<button type="button" class="dbtn ${kindOf(ds)}${n?"":" zero"}" data-date="${ds}" aria-pressed="${ds===st.sel}" aria-label="${m}月${d}日 ${n}件"><span class="m">${d===1||ds===start?m+"月":""}</span><span class="d">${d}</span><span class="w">${ds===t?"今日":DOW[dow(ds)]}</span><span class="c">${n}件</span></button>`;
  ds=addDays(ds,1);
 }
 $("strip").innerHTML=h;
 const cur=$("strip").querySelector('[aria-pressed="true"]');
 if(cur){const s=$("strip");s.scrollLeft=Math.max(0,cur.offsetLeft-s.offsetLeft-s.clientWidth/2+cur.clientWidth/2);}
}

function renderMonth(cnt){
 const [y,m]=st.ym.split("-").map(Number),t=today();
 $("mlabel").textContent=y+"年"+m+"月";
 const first=new Date(y,m-1,1).getDay(),last=new Date(y,m,0).getDate();
 let h=DOW.map((w,i)=>`<div class="mh${i===0?" sun":i===6?" sat":""}">${w}</div>`).join("");
 for(let i=0;i<first;i++)h+='<div class="mc blank"></div>';
 for(let d=1;d<=last;d++){
  const ds=y+"-"+pad(m)+"-"+pad(d),n=cnt[ds]||0;
  h+=`<button type="button" class="mc ${kindOf(ds)}${ds<t?" past":""}${ds===st.sel?" sel":""}" data-date="${ds}" aria-label="${m}月${d}日 ${n}件"><span>${d}</span>${n?`<small>${n}</small>`:""}</button>`;
 }
 const rest=(7-(first+last)%7)%7;for(let i=0;i<rest;i++)h+='<div class="mc blank"></div>';
 $("mgrid").innerHTML=h;
}

function renderLegend(){
 const c={};st.events.forEach(e=>{c[e.genre]=(c[e.genre]||0)+1});
 const ul=$("legend");ul.classList.toggle("filtering",st.genre.size>0);
 ul.innerHTML=st.genres.map(g=>`<li><button type="button" data-g="${esc(g)}" style="--c:${lineColor(g)}" aria-pressed="${st.genre.has(g)}"><span class="sw"></span>${esc(g)}<span class="n">${c[g]||0}</span></button></li>`).join("");
}

function evRow(e){
 const c=lineColor(e.genre),mm=e.start?e.start.split(":")[1]||"":"";
 const title=e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener" style="--c:${c}">${esc(e.title)}</a>`:esc(e.title);
 const fee=e.fee?`<span class="${isFree(e)?"fee-free":""}">${esc(e.fee)}</span>`:"";
 return `<div class="ev"><div class="mm">${esc(mm)}</div><div><h3><span class="line" style="--c:${c}" title="${esc(e.genre||"")}"></span>${title}</h3><div class="sub">${e.end?`<span>${esc(e.start||"")}〜${esc(e.end)}</span>`:""}<span>${esc(e.venue||"")}</span>${fee}<span class="src">${esc(e.genre||"")}／${esc(e.source||"")}</span></div></div></div>`;
}

function renderBoard(list){
 const ds=st.sel,[y,m,d]=parts(ds),w=dow(ds),k=kindOf(ds);
 const band=k==="sun"?"var(--sun)":k==="sat"?"var(--sat)":"#1b2a4a";
 const items=list.filter(e=>e.date===ds).sort((a,b)=>(a.start||"99").localeCompare(b.start||"99"));
 let h=`<div class="dayhead" style="--band:${band}"><h2>${m}月${d}日（${DOW[w]}）</h2><span class="kind">${k==="sun"?"休日":k==="sat"?"土曜":"平日"}</span><span class="cnt">${items.length}件</span></div><div class="tt" style="--band:${band}">`;
 if(!items.length){
  const filteringNow=st.genre.size||$("q").value.trim()||$("source").value||$("free").checked;
  h+=`<div class="nothing">${filteringNow?"この日、条件に合うイベントはありません。":"この日に登録されたイベントはありません。"}${filteringNow?'<br><button type="button" id="clear2">条件をクリアする</button>':""}</div>`;
 }else{
  const groups=new Map();
  items.forEach(e=>{const k=e.start?e.start.split(":")[0].replace(/^0(?=\d)/,""):"時刻未定";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e);});
  groups.forEach((evs,hr)=>{h+=`<div class="hour${hr==="時刻未定"?" undated":""}"><div class="hh">${esc(hr)}</div><div>${evs.map(evRow).join("")}</div></div>`;});
 }
 h+="</div>";
 $("board").innerHTML=h;
 const c2=$("clear2");if(c2)c2.onclick=clearAll;
 const t=today();$("pday").disabled=false;
}

function render(){
 const list=filtered(),cnt=countBy(list);
 renderNow();renderStrip(cnt);renderMonth(cnt);renderBoard(list);saveHash();
}

function select(ds,keepMonth){st.sel=ds;if(!keepMonth)st.ym=ds.slice(0,7);render();}
function clearAll(){$("q").value="";$("source").value="";$("free").checked=false;st.genre.clear();renderLegend();render();}

function saveHash(){
 const p=new URLSearchParams();
 if(st.sel!==today())p.set("d",st.sel);
 if(st.genre.size)p.set("g",[...st.genre].join(","));
 if($("source").value)p.set("s",$("source").value);
 if($("q").value.trim())p.set("q",$("q").value.trim());
 if($("free").checked)p.set("free","1");
 const s=p.toString();history.replaceState(null,"",s?"#"+s:location.pathname+location.search);
}
function loadHash(){
 const p=new URLSearchParams(location.hash.slice(1));
 if(/^\d{4}-\d{2}-\d{2}$/.test(p.get("d")||""))st.sel=p.get("d");
 (p.get("g")||"").split(",").filter(Boolean).forEach(g=>st.genre.add(g));
 if(p.get("q"))$("q").value=p.get("q");
 if(p.get("free"))$("free").checked=true;
 return p.get("s")||"";
}

$("strip").addEventListener("click",e=>{const b=e.target.closest("[data-date]");if(b)select(b.dataset.date);});
$("mgrid").addEventListener("click",e=>{const b=e.target.closest("[data-date]");if(b)select(b.dataset.date,true);});
$("legend").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;const g=b.dataset.g;st.genre.has(g)?st.genre.delete(g):st.genre.add(g);renderLegend();render();});
$("calbtn").onclick=()=>{const o=$("month").classList.toggle("open");$("calbtn").setAttribute("aria-expanded",o);};
function shiftMonth(n){let [y,m]=st.ym.split("-").map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}st.ym=y+"-"+pad(m);render();}
$("mprev").onclick=()=>shiftMonth(-1);$("mnext").onclick=()=>shiftMonth(1);
$("pday").onclick=()=>select(addDays(st.sel,-1));$("nday").onclick=()=>select(addDays(st.sel,1));
let qt;$("q").addEventListener("input",()=>{clearTimeout(qt);qt=setTimeout(render,150);});
$("source").onchange=render;$("free").onchange=render;$("clear").onclick=clearAll;
document.addEventListener("keydown",e=>{if(e.target.matches("input,select,textarea"))return;if(e.key==="ArrowLeft")select(addDays(st.sel,-1));if(e.key==="ArrowRight")select(addDays(st.sel,1));if(e.key==="/"){e.preventDefault();$("q").focus();}});

st.sel=today();
const srcFromHash=loadHash();
st.ym=st.sel.slice(0,7);
$("board").innerHTML='<div class="nothing">読み込み中…</div>';
fetch("events.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
 st.meta=d;st.events=d.events||[];
 st.genres=d.genres&&d.genres.length?d.genres:[...new Set(st.events.map(e=>e.genre).filter(Boolean))];
 const order=Object.keys(LINE);st.genres.sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
 const sources=d.sources&&d.sources.length?d.sources:[...new Set(st.events.map(e=>e.source).filter(Boolean))];
 sources.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;$("source").appendChild(o);});
 if(srcFromHash)$("source").value=srcFromHash;
 renderLegend();render();
}).catch(()=>{$("board").innerHTML='<div class="nothing">イベント情報を読み込めませんでした。ページを再読み込みしてください。</div>';});
</script>
</body>
</html>
